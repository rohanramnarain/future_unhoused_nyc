<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 320" role="img" aria-label="Random Forest diagram: multiple decision trees averaged together">
  <defs>
    <style>
      .t { font: 600 22px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; fill: #111827; }
      .s { font: 14px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; fill: #374151; }
      .edge { stroke: #9ca3af; stroke-width: 5; stroke-linecap: round; }
      .node { fill: #3b82f6; stroke: #2563eb; stroke-width: 4; }
      .out { fill: #10b981; stroke: #059669; stroke-width: 4; }
      .dash { stroke: #9ca3af; stroke-width: 6; stroke-linecap: round; }
    </style>

    <!-- A simple balanced decision tree icon (symbol) -->
    <symbol id="tree" viewBox="0 0 260 190">
      <!-- edges -->
      <line class="edge" x1="130" y1="28" x2="70" y2="72" />
      <line class="edge" x1="130" y1="28" x2="190" y2="72" />

      <line class="edge" x1="70" y1="72" x2="38" y2="120" />
      <line class="edge" x1="70" y1="72" x2="102" y2="120" />

      <line class="edge" x1="190" y1="72" x2="158" y2="120" />
      <line class="edge" x1="190" y1="72" x2="222" y2="120" />

      <line class="edge" x1="38" y1="120" x2="22" y2="162" />
      <line class="edge" x1="38" y1="120" x2="54" y2="162" />

      <line class="edge" x1="102" y1="120" x2="86" y2="162" />
      <line class="edge" x1="102" y1="120" x2="118" y2="162" />

      <line class="edge" x1="158" y1="120" x2="142" y2="162" />
      <line class="edge" x1="158" y1="120" x2="174" y2="162" />

      <line class="edge" x1="222" y1="120" x2="206" y2="162" />
      <line class="edge" x1="222" y1="120" x2="238" y2="162" />

      <!-- nodes -->
      <circle class="node" cx="130" cy="28" r="18" />
      <circle class="node" cx="70" cy="72" r="18" />
      <circle class="node" cx="190" cy="72" r="18" />

      <circle class="node" cx="38" cy="120" r="18" />
      <circle class="node" cx="102" cy="120" r="18" />
      <circle class="node" cx="158" cy="120" r="18" />
      <circle class="node" cx="222" cy="120" r="18" />

      <circle class="node" cx="22" cy="162" r="18" />
      <circle class="node" cx="54" cy="162" r="18" />
      <circle class="node" cx="86" cy="162" r="18" />
      <circle class="node" cx="118" cy="162" r="18" />
      <circle class="node" cx="142" cy="162" r="18" />
      <circle class="node" cx="174" cy="162" r="18" />
      <circle class="node" cx="206" cy="162" r="18" />
      <circle class="node" cx="238" cy="162" r="18" />
    </symbol>
  </defs>

  <text class="t" x="480" y="36" text-anchor="middle">Random Forest = many trees in parallel</text>
  <text class="s" x="480" y="60" text-anchor="middle">Each tree votes; we average the votes</text>

  <!-- tree labels -->
  <!-- trees -->
  <use href="#tree" xlink:href="#tree" x="40" y="66" width="260" height="190" />
  <use href="#tree" xlink:href="#tree" x="350" y="66" width="260" height="190" />
  <use href="#tree" xlink:href="#tree" x="660" y="66" width="260" height="190" />

  <!-- ellipsis -->
  <circle class="node" cx="640" cy="178" r="6" />
  <circle class="node" cx="640" cy="200" r="6" />
  <circle class="node" cx="640" cy="222" r="6" />

  <!-- aggregation output -->
  <line class="dash" x1="170" y1="252" x2="480" y2="252" />
  <line class="dash" x1="480" y1="252" x2="790" y2="252" />

  <line class="edge" x1="480" y1="252" x2="480" y2="268" />
  <circle class="out" cx="480" cy="268" r="10" />

  <text class="s" x="510" y="272">Average / vote</text>
</svg>
