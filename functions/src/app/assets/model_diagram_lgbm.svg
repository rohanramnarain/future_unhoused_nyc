<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 340" role="img" aria-label="LightGBM diagram: gradient boosting with leaf-wise tree growth">
  <defs>
    <style>
      .t { font: 600 22px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; fill: #111827; }
      .s { font: 14px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; fill: #374151; }
      .edge { stroke: #9ca3af; stroke-width: 5; stroke-linecap: round; }
      .node { fill: #3b82f6; stroke: #2563eb; stroke-width: 4; }
      .node2 { fill: #60a5fa; stroke: #2563eb; stroke-width: 4; }
      .out { fill: #10b981; stroke: #059669; stroke-width: 4; }
      .arrow { stroke: #6b7280; stroke-width: 5; fill: none; marker-end: url(#m); }
    </style>

    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#6b7280" />
    </marker>

    <!-- Slightly unbalanced tree to hint at leaf-wise growth -->
    <symbol id="tree_unbalanced" viewBox="0 0 260 220">
      <line class="edge" x1="130" y1="28" x2="70" y2="72" />
      <line class="edge" x1="130" y1="28" x2="190" y2="72" />

      <line class="edge" x1="70" y1="72" x2="38" y2="120" />
      <line class="edge" x1="70" y1="72" x2="102" y2="120" />

      <!-- deeper split on the right branch -->
      <line class="edge" x1="190" y1="72" x2="158" y2="120" />
      <line class="edge" x1="190" y1="72" x2="222" y2="120" />
      <line class="edge" x1="222" y1="120" x2="206" y2="162" />
      <line class="edge" x1="222" y1="120" x2="238" y2="162" />
      <line class="edge" x1="238" y1="162" x2="228" y2="184" />
      <line class="edge" x1="238" y1="162" x2="248" y2="184" />

      <circle class="node" cx="130" cy="28" r="18" />
      <circle class="node" cx="70" cy="72" r="18" />
      <circle class="node" cx="190" cy="72" r="18" />

      <circle class="node" cx="38" cy="120" r="18" />
      <circle class="node" cx="102" cy="120" r="18" />
      <circle class="node" cx="158" cy="120" r="18" />
      <circle class="node" cx="222" cy="120" r="18" />

      <circle class="node" cx="206" cy="162" r="18" />
      <circle class="node" cx="238" cy="162" r="18" />
      <circle class="node2" cx="228" cy="184" r="14" />
      <circle class="node2" cx="248" cy="184" r="14" />
    </symbol>
  </defs>

  <text class="t" x="480" y="36" text-anchor="middle">LightGBM = gradient boosting (leaf-wise trees)</text>
  <text class="s" x="480" y="60" text-anchor="middle">Adds many small trees; LightGBM tends to grow the “best leaf” first</text>

  <use href="#tree_unbalanced" xlink:href="#tree_unbalanced" x="40" y="66" width="260" height="190" />
  <use href="#tree_unbalanced" xlink:href="#tree_unbalanced" x="350" y="66" width="260" height="190" />
  <use href="#tree_unbalanced" xlink:href="#tree_unbalanced" x="660" y="66" width="260" height="190" />

  <path class="arrow" d="M310 168 C330 168, 330 168, 350 168" />
  <path class="arrow" d="M620 168 C640 168, 640 168, 660 168" />

  <text class="s" x="330" y="152" text-anchor="middle">+ residual</text>
  <text class="s" x="640" y="152" text-anchor="middle">+ residual</text>

  <line class="edge" x1="790" y1="252" x2="820" y2="268" />
  <circle class="out" cx="840" cy="276" r="10" />
  <text class="s" x="858" y="280">Final score</text>
</svg>
